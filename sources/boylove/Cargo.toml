[package]
name = "koma_boylove_source"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
koma_source_sdk = { path = "../../sdk" }
dlmalloc = { version = "=0.2.14", features = ["global"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["alloc"] }
url = { version = "=2.5.8", default-features = false }
percent-encoding = { version = "=2.3.2", default-features = false, features = ["alloc"] }
