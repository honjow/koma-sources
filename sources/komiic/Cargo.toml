[package]
name = "koma_komiic_source"
version = "0.1.20"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
koma_source_sdk = { path = "../../sdk" }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
dlmalloc = { version = "=0.2.14", features = ["global"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
