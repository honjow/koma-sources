name: Build and publish source library

on:
  push:
    branches: [master]
    paths-ignore:
      - image-rules/**
      - .github/workflows/image-rules.yml
  pull_request:
    branches: [master]
    paths-ignore:
      - image-rules/**
      - .github/workflows/image-rules.yml
  workflow_dispatch:

concurrency:
  group: sources-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sources-${{ github.sha }}
          restore-keys: ${{ runner.os }}-sources-
      - name: Point apt at a mirror that resolves
        run: |
          # Hosted runners intermittently fail DNS for *.ubuntu.com while
          # github.com / static.rust-lang.org resolve fine (2026-11-11 outage).
          # The image's mirror+file:/etc/apt/apt-mirrors.txt source reads its
          # mirror URL from that file; redirect it to a mirror that resolves.
          set -euo pipefail
          sudo sh -c 'echo "http://mirrors.aliyun.com/ubuntu/" > /etc/apt/apt-mirrors.txt'
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y jq zip python3-pil
      - name: Check complete workspace coverage
        run: bash build.sh --check-registry
      - name: Check chapter SDK compile contract
        run: cargo test --locked -p koma_source_sdk --doc
      - name: Type-check sources before WASM compilation
        run: cargo check --locked --release --target wasm32-unknown-unknown --workspace --exclude koma-source-dev
      - name: Compile all production sources and teaching demo
        run: bash build.sh --compile-only
      - name: Check every compiled source metadata (offline)
        run: |
          set -euo pipefail
          for wasm in target/wasm32-unknown-unknown/release/koma_*_source.wasm; do
            target/release/koma-source-dev info "$wasm" | jq -e '.data.sourceInfo | (.id | length > 0) and (.version | length > 0)'
          done
      - name: Package source library without provider requests
        run: bash build.sh --package-only --tag "sources-${GITHUB_SHA}"
      - name: Publication coverage
        run: |
          jq -r '"Installable: \([.[] | select(.available)] | length)\nUnavailable: \([.[] | select(.available == false)] | length)", (.[] | select(.available == false) | "- \(.name) (\(.id)): \(.reason)")' dist/catalogue.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: source-library-${{ github.sha }}
          path: |
            dist/index.json
            dist/repo.json
            dist/catalogue.json
            dist/release-packages/*
            dist/release-icons/*
          if-no-files-found: error
      - name: Publish complete release atomically
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: sources-${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/source-release-state; then
            if [[ "$(cat /tmp/source-release-state)" != true ]]; then
              echo "This revision is already published; keeping its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Source library ${GITHUB_SHA:0:8}" --notes "Automatic source library. index.json lists installable packages; catalogue.json records every production source and its availability status. Build success does not certify all provider content."
          fi
          gh release upload "$RELEASE_TAG" dist/index.json dist/repo.json dist/catalogue.json dist/release-packages/* dist/release-icons/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
