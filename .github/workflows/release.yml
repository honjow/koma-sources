name: Build and Release Sources

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install tools
        run: sudo apt-get install -y jq zip

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        run: ./build.sh --tag "${{ steps.tag.outputs.tag }}"

      - name: Test sources
        run: |
          DEV=target/release/koma-source-dev
          for wasm in target/wasm32-unknown-unknown/release/koma_*.wasm; do
            [[ -f "$wasm" ]] || continue
            echo "Testing $(basename $wasm)..."
            $DEV info "$wasm" | jq -r '.data.sourceInfo | "\(.name) v\(.version)"'
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/index.json
            dist/sources/**/*.koma
            target/release/koma-source-dev
          generate_release_notes: true
