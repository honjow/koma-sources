name: Build and publish image rules

on:
  push:
    branches: [master]
    paths:
      - image-rules/**
      - .github/workflows/image-rules.yml
  pull_request:
    branches: [master]
    paths:
      - image-rules/**
      - .github/workflows/image-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-rules-publication
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install image decoder
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Generate rules
        run: python3 image-rules/generate.py
      - name: Publish content-addressed resources
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$(mktemp)"
          rm "$GIT_INDEX_FILE"
          parent=()
          if git ls-remote --exit-code --heads origin image-rules >/dev/null; then
            git fetch --no-tags origin refs/heads/image-rules:refs/remotes/origin/image-rules
            git read-tree refs/remotes/origin/image-rules
            parent=(-p refs/remotes/origin/image-rules)
          else
            git read-tree --empty
          fi
          for file in image-rules/dist/*.json; do
            path="${file#image-rules/dist/}"
            hash="$(git hash-object -w "$file")"
            git update-index --add --cacheinfo "100644,$hash,$path"
          done
          tree="$(git write-tree)"
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit-tree "$tree" "${parent[@]}" -m "Publish image rules from $GITHUB_SHA" > /tmp/image-rules-commit
          git push origin "$(cat /tmp/image-rules-commit):refs/heads/image-rules"
      - name: Publish fixed release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=image-rules-v1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$(cat /tmp/image-rules-commit)" --title "Image rules" --notes "Content-addressed image rule packs." --latest=false
          fi
          mkdir -p /tmp/image-rules-existing
          while IFS= read -r pack; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$pack"; then
              gh release download "$tag" --pattern "$pack" --dir /tmp/image-rules-existing
              cmp "image-rules/dist/$pack" "/tmp/image-rules-existing/$pack"
            else
              gh release upload "$tag" "image-rules/dist/$pack"
            fi
          done < <(jq -r '.packs[].path' image-rules/dist/index.json)
          # Publish the index only after the immutable pack is present.
          gh release upload "$tag" image-rules/dist/index.json --clobber
