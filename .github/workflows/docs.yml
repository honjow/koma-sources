name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build docs
        run: |
          cargo doc --no-deps -p koma-source-sdk --target wasm32-unknown-unknown
          # Add redirect from root to sdk docs
          echo '<meta http-equiv="refresh" content="0;url=koma_source_sdk/index.html">' > target/wasm32-unknown-unknown/doc/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/wasm32-unknown-unknown/doc
          publish_branch: gh-pages
