<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koma Source Dev</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg:   { DEFAULT:'#0a0a0b', card:'#121214', hover:'#18181b', border:'#27272a', muted:'#3f3f46' },
        fg:   { DEFAULT:'#fafafa', dim:'#a1a1aa', mute:'#71717a' },
        accent:{ DEFAULT:'#a78bfa', hover:'#c4b5fd', dim:'#7c3aed' },
      }
    }
  }
}
</script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  [v-cloak] { display: none; }
  * { scrollbar-width: thin; scrollbar-color: #27272a transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 1rem; }
  @media(min-width:640px){ .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); } }
  .manga-card { border-radius: .625rem; overflow: hidden; transition: transform .15s, box-shadow .15s; cursor: pointer; }
  .manga-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  .manga-card img { aspect-ratio: 3/4; object-fit: cover; width: 100%; display: block; background: #18181b; }
  .scroll-row { display: flex; gap: .75rem; overflow-x: auto; padding-bottom: .5rem; scroll-snap-type: x mandatory; }
  .scroll-row::-webkit-scrollbar { height: 4px; }
  .scroll-row::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
  .scroll-row > * { scroll-snap-align: start; flex-shrink: 0; }
  .skeleton { background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: .5rem; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; background: #27272a; border-radius: 2px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #a78bfa; border-radius: 50%; cursor: pointer; }
  .page-enter-active, .page-leave-active { transition: opacity .12s, transform .12s; }
  .page-enter-from { opacity: 0; transform: translateY(6px); }
  .page-leave-to { opacity: 0; transform: translateY(-6px); }
</style>
</head>
<body class="bg-bg text-fg h-full overflow-hidden">
<div id="app" v-cloak class="h-full"></div>

<script src="/js/store.js"></script>
<script src="/js/router.js"></script>
<script src="/js/components/sidebar.js"></script>
<script src="/js/components/mobile-nav.js"></script>
<script src="/js/components/home-page.js"></script>
<script src="/js/components/search-page.js"></script>
<script src="/js/components/browse-page.js"></script>
<script src="/js/components/manga-detail.js"></script>
<script src="/js/components/reader-page.js"></script>
<script src="/js/components/ui.js"></script>
<script src="/js/app.js"></script>
<script>Vue.createApp(App).mount('#app');</script>
</body>
</html>
